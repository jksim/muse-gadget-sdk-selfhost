# musehost, the self-hosted Muse server in server/.
name: Server

on:
  pull_request:
  push:
    branches: [self-host]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"  # Raspberry Pi OS (Debian 13)

      - name: Install
        run: |
          python -m pip install uv
          uv sync --frozen

      # The fast suite; `-m slow` (real Whisper and Piper models) stays local.
      - name: Run tests
        run: uv run pytest -q

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: ShellCheck
        run: shellcheck server/install.sh server/deploy/dev-deploy.sh esp32/tools/muse/selfhost.sh
