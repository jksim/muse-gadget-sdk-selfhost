{% if message %}<p class="muted">{{ message }}</p>{% endif %}
{% if items %}<table>{% for key, value in items %}
  <tr><th>{{ key }}</th><td>{% if value is mapping %}{% for k, v in value.items() %}{{ k }}: {{ v }}{{ ", " if not loop.last }}{% endfor %}{% else %}{{ value }}{% endif %}</td></tr>
{% endfor %}</table>{% endif %}
