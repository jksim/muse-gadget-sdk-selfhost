<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
  <title>{{ title or "musehost" }} · musehost</title>
  <link rel="stylesheet" href="/dashboard/static/dashboard.css">
  <script src="/dashboard/static/htmx.min.js"></script>
  <script src="/dashboard/static/sse.min.js"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <header>
    <span class="brand">musehost</span>
    {% if signed_in %}
    <nav>
      <a href="/dashboard">Status</a>
      <a href="/dashboard/gadgets">Gadgets</a>
      <a href="/dashboard/pair">Pair</a>
      <a href="/dashboard/flash">Flash</a>
      <a href="/dashboard/chat">Chat</a>
      <a href="/dashboard/history">History</a>
      <a href="/dashboard/settings">Settings</a>
      <form method="post" action="/dashboard/logout" class="inline">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
