{% extends "base.html" %}
{% block content %}
<h1>Gadgets</h1>
<section>
  <table>
    <thead><tr><th>Name</th><th>Node</th><th>Now</th><th>Firmware</th><th>Last seen</th><th>Enrolled</th></tr></thead>

</section>
{% endblock %}
