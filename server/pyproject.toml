[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "musehost"
version = "0.1.0"
description = "Self-hosted host for Muse gadgets"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "bleak>=0.22",
    "cryptography>=42",
    "esptool>=5",
    "faster-whisper>=1.2",
    "musegadget",  # the SDK's pairing, BLE framing and Noise code
    "openai>=3.24",
    "piper-tts>=1.8",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
musehost = "musehost.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: uses the real faster-whisper model (downloads tiny.en once)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S607"]  # tests compare with openssl

[tool.uv.sources]
musegadget = { path = "../muse-gadget-sdk-selfhost/linux", editable = true }
